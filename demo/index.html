<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FACTS — Live Demo</title>
<meta name="description" content="Interactive demo of the FACTS OEE dashboard (simulated data).">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI1MTIiIGhlaWdodD0iNTEyIiB2aWV3Qm94PSIwIDAgNTEyIDUxMiI+CjxyZWN0IHdpZHRoPSI1MTIiIGhlaWdodD0iNTEyIiByeD0iMTEyIiByeT0iMTEyIiBmaWxsPSIjMDA3NkMwIi8+CjxnIHRyYW5zZm9ybT0idHJhbnNsYXRlKDE0MC44NywzODkuMTIpIHNjYWxlKDAuMzg3MCwtMC4zODcwKSI+PHBhdGggZD0iTTYxIDBWNjg4SDUzNFY1MzdIMjY2VjM5Nkg0OTdWMjQ0SDI2NlYwWiIgZmlsbD0iI0ZGRkZGRiIvPjwvZz4KPC9zdmc+">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Saira:wght@600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  /* ---------- theme tokens ---------- */
  :root{
    --bg:#F3F6F9; --surface:#FFFFFF; --surface-2:#EEF2F6;
    --ink:#12151C; --ink-2:#3a4250; --muted:#6b7280; --line:#DCE2EA;
    --accent:#0076C0; --accent-fg:#fff;
    --side1:#062a54; --side2:#0a4f8f; --side-fg:#d7d7d7; --side-mut:#9fb3cc;
    --good:#1f9d57; --warn:#ed6c02; --bad:#d32f2f;
    --st-exec:#2e7d32; --st-setup:#0288d1; --st-starved:#ed6c02; --st-down:#d32f2f; --st-off:#616161;
    --shadow:0 1px 2px rgba(18,21,28,.05),0 6px 18px rgba(18,21,28,.06);
    --gauge-track:#e4e9f0;
  }
  :root[data-theme="dark"]{
    --bg:#18212f; --surface:#1e2a3c; --surface-2:#243044;
    --ink:#EDF0F4; --ink-2:#C4CBD6; --muted:#93a2ba; --line:#2c3b52;
    --accent:#37a0dd; --accent-fg:#08131d;
    --side1:#152741; --side2:#20406e; --side-fg:#c6d2e2; --side-mut:#7488a3;
    --good:#37b06a; --warn:#f5901a; --bad:#e5675c;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.5);
    --gauge-track:#2b3a52;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:Roboto,system-ui,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;display:flex;height:100vh;overflow:hidden}
  .saira{font-family:Saira,system-ui,sans-serif;letter-spacing:-.01em}

  /* ---------- sidebar ---------- */
  .side{width:250px;flex:0 0 250px;background:linear-gradient(180deg,var(--side1),var(--side2));
    color:var(--side-fg);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .side .top{height:56px;background:rgba(0,0,0,.4);display:flex;align-items:center;padding:0 18px}
  .side .top .hide{margin-left:auto;width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2.4;opacity:.85;cursor:pointer}
  .side .wm{font-family:Saira;font-weight:800;font-size:1.5rem;color:#fff;letter-spacing:-.02em}
  .side .wm .t{color:var(--accent)}
  :root:not([data-theme="dark"]) .side .wm .t{color:#2E9BDD}
  .side nav{padding:14px 10px;display:flex;flex-direction:column;gap:3px}
  .side a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:7px;color:var(--side-fg);
    text-decoration:none;font-size:.92rem;cursor:pointer}
  .side a .ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;flex:0 0 18px}
  .side a.active{background:rgba(255,255,255,.22);color:#fff}
  .side a:hover:not(.active){background:rgba(255,255,255,.08)}
  .side .sec{font-family:"IBM Plex Mono",monospace;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;
    color:var(--side-mut);padding:12px 14px 4px}
  .side .foot{margin-top:auto;padding:14px}
  .side .ver{font-family:"IBM Plex Mono",monospace;font-size:.62rem;color:var(--side-mut);padding:0 4px}

  /* ---------- main ---------- */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh;overflow-y:auto}
  .side nav.bottom{margin-top:auto}
  .side nav.bottom .ver{margin-top:10px}
  .wrap{max-width:1160px;width:100%;margin:0 auto;padding:26px 26px 60px}
  .head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px}
  .head h1{font-family:Saira;font-weight:700;font-size:2rem;margin:0}
  .head .cap{color:var(--muted);font-size:.9rem}
  .badge{font-family:"IBM Plex Mono",monospace;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;
    background:var(--surface-2);color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:4px 10px}
  .spacer{flex:1}
  .chip-range{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--accent);color:var(--accent);
    border-radius:8px;padding:6px 11px;font-size:.8rem;font-weight:600;background:transparent;cursor:pointer}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{border:0;padding:7px 14px;font-size:.8rem;font-weight:600;font-family:Saira;cursor:pointer;
    background:var(--surface);color:var(--muted)}
  .seg button.on{background:var(--accent);color:var(--accent-fg)}

  /* ---------- machine card (row) ---------- */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
    cursor:pointer;overflow:hidden}
  .rows .card{margin-bottom:14px}
  .row{display:flex;align-items:center;gap:18px;padding:15px 18px 8px;flex-wrap:nowrap}
  .glyph{width:150px;height:96px;border-radius:8px;flex:0 0 150px;background:transparent;
    display:flex;align-items:center;justify-content:center;color:var(--muted)}
  .mimg{width:100%;height:100%;object-fit:contain;display:block}
  .idcol{flex:1 1 210px;min-width:0}
  .mname{font-family:Saira;font-weight:700;font-size:1.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kind{color:var(--muted);font-size:.8rem;text-transform:capitalize;margin-top:1px}
  .prog{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:.82rem;margin-top:6px}
  .prog svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.6}
  .metrics{flex:0 1 420px;min-width:0;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  @media (max-width:820px){ .row{flex-wrap:wrap} .metrics{flex:1 1 100%} .glyph{flex-basis:120px;width:120px} }
  .chev{color:var(--muted);flex:0 0 auto}
  .chev svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2}

  /* metric tile (number style, matches OverviewMetrics) */
  .mt{border-radius:7px;padding:7px 9px;background:var(--surface-2);min-width:0}
  .idcol .mname{min-width:0}
  .mt.primary{background:color-mix(in srgb,var(--accent) 14%,transparent)}
  .mt .v{font-family:Saira;font-weight:700;font-size:1.5rem;line-height:1;font-variant-numeric:tabular-nums}
  .mt.primary .v{font-size:1.7rem}
  .mt .l{font-family:"IBM Plex Mono",monospace;font-size:.58rem;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);margin-top:5px}

  /* grid layout */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
  .grid .card{padding:14px}
  .grid .top-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .grid .mname{font-size:1.05rem;flex:1}
  .grid .metrics2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .grid .glyph{width:100%;height:120px;flex:none;margin-bottom:10px}

  /* state chip */
  .state{font-family:"IBM Plex Mono",monospace;font-size:.6rem;font-weight:600;letter-spacing:.06em;
    padding:3px 9px;border-radius:20px;color:#fff;white-space:nowrap}
  .state.off{color:#fff}

  /* gauges (detail) */
  .gauges{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
  .g{display:flex;flex-direction:column;align-items:center;gap:6px}
  .g .lab{font-family:"IBM Plex Mono",monospace;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .g svg{display:block}
  .g .arc{transition:stroke-dashoffset .9s cubic-bezier(.2,.7,.2,1),stroke .4s}
  .g text{font-family:Saira;font-weight:700;fill:var(--ink)}

  /* timeline */
  .tl{margin-top:14px}
  .tl .lb{font-family:"IBM Plex Mono",monospace;font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted);margin-bottom:6px}
  .tl .bar{display:flex;height:14px;border-radius:4px;overflow:hidden;border:1px solid var(--line)}
  .tl .bar i{height:100%;transition:width .9s ease}
  .tl .axis{display:flex;justify-content:space-between;font-size:.62rem;color:var(--muted);margin-top:3px}
  .tl .key{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;font-size:.66rem;color:var(--muted)}
  .tl .key i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:middle}

  /* detail */
  .back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:.8rem;cursor:pointer;
    font-family:"IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}
  .back svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
    padding:22px 24px;margin-top:16px}
  .panel h3{font-family:Saira;font-weight:700;font-size:1.05rem;margin:0 0 14px}
  .kv{width:100%;border-collapse:collapse;font-size:.9rem}
  .kv td{padding:9px 4px;border-top:1px solid var(--line)}
  .kv tr:first-child td{border-top:none}
  .kv .r{text-align:right;font-variant-numeric:tabular-nums}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block;margin-right:6px}
  .live{font-family:"IBM Plex Mono",monospace;font-size:.6rem;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
  .pulse{animation:pulse 2.2s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.35}}
  .pv{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
  .pv .b{background:var(--surface-2);border-radius:7px;padding:9px 11px}
  .pv .b .v{font-family:Saira;font-weight:700;font-size:1.3rem}
  .pv .b .l{font-size:.72rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .themebtn{background:none;border:0;color:var(--side-fg);cursor:pointer}

  @media (max-width:640px){ .side{position:fixed;z-index:20;transform:translateX(-100%);transition:.2s} .metrics{flex-basis:100%} }
  @media (prefers-reduced-motion:reduce){ .g .arc,.tl .bar i{transition:none} .pulse{animation:none} }

  /* collapsible sidebar */
  .side.collapsed{display:none}
  .restore{position:fixed;top:12px;left:12px;z-index:60;width:38px;height:38px;border-radius:8px;
    background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);cursor:pointer;
    display:none;align-items:center;justify-content:center}
  .restore.show{display:flex}
  .restore svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2}

  /* widget dashboard — matches the app's Gridstack board (12-col, explicit x/y/w/h per widget) */
  .wboard{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px;grid-auto-rows:84px}
  .wc{grid-column:var(--x) / span var(--w);grid-row:var(--y) / span var(--h);background:var(--surface);
    border:1px solid var(--line);border-radius:12px;padding:11px 14px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .wc .wt{font-size:.76rem;color:var(--muted);margin-bottom:5px;flex:0 0 auto}
  .wc .wbody{flex:1;min-height:0;display:flex}
  @media(max-width:900px){.wboard{grid-auto-rows:minmax(150px,auto)}.wc{grid-column:1/-1;grid-row:auto}}
  .gl{font-family:"IBM Plex Mono",monospace;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .arc{transition:stroke-dashoffset .9s cubic-bezier(.2,.7,.2,1),stroke .4s}
  .gcell{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
  .wbar{display:flex;flex:1;min-height:20px;border-radius:4px;overflow:hidden;border:1px solid var(--line)}
  .wbar i{height:100%}
  .kpis{display:flex;gap:18px;flex-wrap:wrap;width:100%;justify-content:space-around;align-items:center}
  .kpi{text-align:center}.kpi .v{font-family:Saira;font-weight:700;font-size:2.1rem;line-height:1;font-variant-numeric:tabular-nums}
  .kpi .v small{font-size:.45em;color:var(--muted);font-weight:500;margin-left:3px}
  .bigval{margin:auto;text-align:center}.bigval .v{font-family:Saira;font-weight:700;font-size:2.9rem;line-height:1.05;font-variant-numeric:tabular-nums}
  .bigval .v small{font-size:.4em;color:var(--muted);font-weight:500;margin-left:4px}
  .heat{display:grid;grid-template-columns:52px repeat(24,1fr);gap:2px;align-items:center;font-size:.58rem;width:100%;align-self:center}
  .heat .hd{text-align:center;color:var(--muted)} .heat .rl{color:var(--muted)}
  .heat .cell{border-radius:3px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;color:#e6ecf4;font-size:.52rem}
  .pareto{display:flex;flex-direction:column;gap:9px;width:100%;justify-content:center}
  .pareto .pr{display:grid;grid-template-columns:1fr 34px;gap:8px;align-items:center;font-size:.76rem}
  .pareto .pl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
  .pareto .pb{height:9px;border-radius:3px;background:var(--surface-2);overflow:hidden}
  .pareto .pb i{display:block;height:100%;background:var(--bad);border-radius:3px}
  .pareto .pn{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
  .dev{width:100%;display:flex;flex-direction:column;justify-content:center;gap:7px;font-size:.82rem}
  .dev .r{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:5px}
  .dev .r:last-child{border-bottom:none}.dev .r span:first-child{color:var(--muted)}
  .trendw{flex:1;display:flex;gap:7px;min-height:0;width:100%}
  .trendw .ax{display:flex;flex-direction:column;justify-content:space-between;font-size:.56rem;color:var(--muted);padding:2px 0;text-align:right}
  .trendw svg{flex:1;min-width:0;height:100%}

  /* dashboards hub */
  .dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
  .dcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
  .dcard .th{height:120px;background:var(--surface-2);display:flex;align-items:center;justify-content:center}
  .dcard .th img{max-width:84%;max-height:100%;object-fit:contain}
  .dcard .db{padding:14px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
  .dcard .dn{font-family:Saira;font-weight:700;font-size:1.02rem;line-height:1.25}
  .dcard .dm{color:var(--muted);font-size:.8rem}
  .dcard .da{display:flex;gap:8px;margin-top:auto;padding-top:12px}
  .btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
    border-radius:8px;padding:7px 14px;font-family:Saira;font-weight:600;font-size:.86rem;cursor:pointer}
  .btn:hover{border-color:var(--accent)}
  .btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
  .btn[disabled]{opacity:.5;cursor:not-allowed}
  .sech{font-family:Saira;font-weight:700;font-size:1.15rem;margin:30px 0 12px}
  .rotcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .rotcard .rn{font-family:Saira;font-weight:700;font-size:1.02rem}.rotcard .rd{color:var(--muted);font-size:.82rem;flex:1;min-width:200px}

  /* fleet */
  .tabs{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .tabs button{border:0;padding:7px 15px;font-family:Saira;font-weight:600;font-size:.84rem;background:var(--surface);color:var(--muted);cursor:pointer}
  .tabs button.on{background:var(--accent);color:var(--accent-fg)}
  select.sel{border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:8px;padding:6px 10px;font-weight:600;font-size:.82rem}
  .site{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
  .site .sh{display:flex;align-items:center;gap:14px;padding:14px 18px;flex-wrap:wrap}
  .site .sn{font-family:Saira;font-weight:700;font-size:1.15rem}
  .site .ss{color:var(--muted);font-size:.8rem}
  .site .sm{padding:0 18px 12px;display:grid;grid-template-columns:repeat(4,minmax(0,160px));gap:8px}
  .site .shb{padding:0 18px 14px}
  .hrs{display:flex;height:14px;border-radius:4px;overflow:hidden;border:1px solid var(--line)}
  .hrs i{height:100%}
  .hkey{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;font-size:.7rem;color:var(--muted)}
  .hkey span i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:middle}
  .warnchip{font-family:"IBM Plex Mono",monospace;font-size:.62rem;background:color-mix(in srgb,var(--warn) 18%,transparent);
    color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);padding:3px 9px;border-radius:20px}
  .mtab{width:100%;border-collapse:collapse;font-size:.84rem}
  .mtab th{font-family:"IBM Plex Mono",monospace;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:right;padding:6px 10px;border-top:1px solid var(--line)}
  .mtab td{padding:7px 10px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
  .mtab th:first-child,.mtab td:first-child{text-align:left}
  .note{color:var(--muted);font-size:.8rem;margin:14px 2px 0;max-width:80ch}
  .lrow{display:flex;align-items:center;gap:16px;padding:10px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
  .lrow img{width:72px;height:46px;object-fit:contain;flex:0 0 72px}
  .lrow .ln{font-family:Saira;font-weight:700;font-size:.98rem;min-width:170px;flex:1 1 170px}
  .lrow .lp{color:var(--muted);font-size:.78rem;min-width:110px}
  .lrow .lm{display:grid;grid-template-columns:repeat(4,64px);gap:6px}
  .lrow .lm .mt{padding:5px 7px}.lrow .lm .mt .v{font-size:1.05rem}.lrow .lm .mt .l{font-size:.5rem}

  /* automations */
  .auto{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
  .auto .ah{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
  .auto .ah b{font-family:Saira;font-weight:700;font-size:1.05rem}
  .auto .ar{display:flex;gap:16px;padding:11px 18px;border-top:1px solid var(--line);align-items:baseline}
  .auto .ah+.ar{border-top:none}
  .auto .ak{font-family:"IBM Plex Mono",monospace;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);min-width:64px}
  .auto .av{font-size:.9rem;display:flex;flex-direction:column;gap:4px}
  .auto .av .sub{color:var(--muted);font-size:.78rem}
  .auto .af{padding:10px 18px;background:var(--surface-2);color:var(--muted);font-size:.78rem;display:flex;gap:18px;flex-wrap:wrap}
  .sw2{margin-left:auto;width:42px;height:24px;border-radius:12px;background:var(--st-off);position:relative;cursor:pointer;border:0;flex:0 0 42px;transition:background .2s}
  .sw2::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s}
  .sw2.on{background:var(--good)}.sw2.on::after{left:21px}
  .hist{width:100%;border-collapse:collapse;font-size:.84rem}
  .hist td{padding:9px 14px;border-top:1px solid var(--line);vertical-align:top}
  .hist tr:first-child td{border-top:none}
  .hist .t{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
  .out{font-family:"IBM Plex Mono",monospace;font-size:.62rem;letter-spacing:.06em;padding:2px 8px;border-radius:10px;color:#fff;white-space:nowrap}

<script>
"use strict";
const RM = window.matchMedia('(prefers-reduced-motion:reduce)').matches;

/* ---------- state colours ---------- */
const STATE = {
  EXECUTING:{c:'var(--st-exec)',label:'EXECUTING'},
  SETUP:{c:'var(--st-setup)',label:'SETUP'},
  STARVED:{c:'var(--st-starved)',label:'STARVED'},
  DOWN:{c:'var(--st-down)',label:'DOWN'},
  OFF:{c:'var(--st-off)',label:'OFF'},
};
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const gaugeColor=p=> p>=85?'var(--good)':p>=60?'var(--warn)':'var(--bad)';

/* ---------- seed machines ---------- */
function seedTimeline(mix){ // mix: array of [state, weightSecs]
  return mix.map(([s,secs])=>({state:s,secs}));
}
const MACHINES = [
  {id:'ppeb',name:'PPEB 220/30',kind:'pressbrake',img:'img/ppeb.png',program:'PRT-007420-01-Rev A',state:'EXECUTING',
   a:.91,p:.82,q:.98,completed:184,total:250,good:181,bad:3,
   tl:seedTimeline([['EXECUTING',3600],['SETUP',700],['DOWN',420],['EXECUTING',5200],['STARVED',300],['EXECUTING',2600]])},
  {id:'puma',name:'Puma 6kW',kind:'laser',img:'img/puma.png',program:'20408',state:'EXECUTING',
   a:.94,p:.92,q:null,completed:57,total:64,good:0,bad:0,
   tl:seedTimeline([['EXECUTING',6400],['SETUP',480],['EXECUTING',4200],['STARVED',260],['EXECUTING',1900]])},
  {id:'strippit',name:'Strippit PX-1530',kind:'punching',img:'img/strippit.png',program:'JOB-774',state:'SETUP',
   a:.77,p:.79,q:null,completed:22,total:120,good:0,bad:0,
   tl:seedTimeline([['EXECUTING',2800],['DOWN',900],['SETUP',1400],['EXECUTING',3200],['SETUP',600]])},
  {id:'hcn',name:'HCN-5000',kind:'machining',img:'img/hcn.png',program:'TH-6965-OP3',state:'EXECUTING',
   a:.88,p:.86,q:.99,completed:311,total:400,good:308,bad:3,
   tl:seedTimeline([['EXECUTING',5200],['SETUP',540],['EXECUTING',4800],['DOWN',360],['EXECUTING',3100]])},
  {id:'nitro',name:'NitroCube',kind:'utility',img:'img/nitrocube.png',program:null,state:'EXECUTING',uptime:.992,

];
const byId=id=>MACHINES.find(m=>m.id===id);

// Sample "programs completed this shift" [name, parts, finished-ago] for the detail view.
const PROG = {

  puma:[['20408',64,'11 min'],['20404',120,'1.1 h'],['20399',48,'2.4 h']],

};

/* ---------- app state ---------- */
let layout = 'rows';
let route = {view:'overview', id:null};
const view = document.getElementById('view');

/* ---------- theme ---------- */
function applyTheme(t){
  if(t==='dark') document.documentElement.setAttribute('data-theme','dark');

  document.getElementById('themeLabel').textContent = t==='dark'?'Day mode':'Night mode';
  document.getElementById('themeIcon').innerHTML = t==='dark'
    ? '<circle cx="12" cy="12" r="4.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>'
    : '<path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/>';
  try{localStorage.setItem('facts.demo.theme',t);}catch(e){}
}
let theme='light';
try{ theme = localStorage.getItem('facts.demo.theme') || (window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'); }catch(e){}
applyTheme(theme);
document.getElementById('themeToggle').onclick=()=>{ theme=theme==='dark'?'light':'dark'; applyTheme(theme); };

/* Shareable deep-links: ?theme=dark&layout=grid&m=<machineId> */
const QS=new URLSearchParams(location.search);
if(QS.get('theme')){ theme=QS.get('theme')==='dark'?'dark':'light'; applyTheme(theme); }
if(QS.get('layout')==='grid') layout='grid';

/* ---------- svg helpers ---------- */
const R=22, C=2*Math.PI*R;
function gaugeSVG(pct,big){
  const size=big?70:58, r=big?26:22, c=2*Math.PI*r, off=c*(1-pct/100), fs=big?18:15;
  const col=gaugeColor(pct);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--gauge-track)" stroke-width="${big?6:5}"/>
    <circle class="arc" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${big?6:5}"
      stroke-linecap="round" transform="rotate(-90 ${size/2} ${size/2})"
      stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/>
    <text x="${size/2}" y="${size/2+fs*0.35}" text-anchor="middle" font-size="${fs}">${Math.round(pct)}</text>
  </svg>`;
}
const GLYPH=`<svg viewBox="0 0 24 24"><path d="M6 20h12M8 20v-5m8 5v-8M7 15l4-4 3 2 4-6"/><circle cx="9" cy="7" r="1.4"/></svg>`;
const DOCICON=`<svg viewBox="0 0 24 24"><path d="M6 2h8l4 4v16H6zM14 2v4h4"/></svg>`;

function stateChip(s){ const st=STATE[s]; return `<span class="state" style="background:${st.c}">${st.label}</span>`; }

function metricTile(label,val,primary){
  const disp = val==null?'—':Math.round(val*100)+'';
  return `<div class="mt ${primary?'primary':''}"><div class="v" style="color:${val==null?'var(--muted)':(primary?'var(--ink)':'var(--ink)')}">${disp}${val==null?'':'<span style="font-size:.55em;color:var(--muted)">%</span>'}</div><div class="l">${label}</div></div>`;
}
function timelineBar(tl){
  const tot=tl.reduce((s,x)=>s+x.secs,0)||1;
  const bars=tl.map(x=>`<i style="width:${(x.secs/tot*100).toFixed(2)}%;background:${STATE[x.state].c}"></i>`).join('');
  const states=[...new Set(tl.map(x=>x.state))];
  const key=states.map(s=>`<span><i style="background:${STATE[s].c}"></i>${STATE[s].label[0]+STATE[s].label.slice(1).toLowerCase()}</span>`).join('');
  return {bars,key};
}

/* ---------- overview ---------- */
function overviewMetrics(m,cols){
  if(m.kind==='utility'){
    const cells=[`<div class="mt primary"><div class="v">${Math.round(m.uptime*100)}<span style="font-size:.55em;color:var(--muted)">%</span></div><div class="l">Uptime</div></div>`];
    m.process.slice(0,cols-1).forEach(p=>cells.push(`<div class="mt"><div class="v">${fmt(p.v)}</div><div class="l">${p.l}</div></div>`));
    return cells.join('');
  }
  return metricTile('OEE',oee(m),true)+metricTile('Availability',m.a)+metricTile('Performance',m.p)+metricTile('Quality',m.q);
}
const fmt=v=> Math.abs(v)>=100||v===Math.round(v)?Math.round(v):v.toFixed(1);

function renderOverview(){
  const tiles = MACHINES.map(m=>{
    const t=timelineBar(m.tl);
    if(layout==='grid'){

        <div class="metrics2" style="margin-top:10px" data-r="metrics-${m.id}">${overviewMetrics(m,2)}</div>
        <div class="tl"><div class="bar" data-r="tl-${m.id}">${t.bars}</div></div>
      </div>`;
    }
    return `<div class="card" data-open="${m.id}"><div class="row">
      <div class="glyph"><img class="mimg" src="${m.img}" alt="${m.name}"></div>
      <div class="idcol">
        <div style="display:flex;align-items:center;gap:9px"><span class="mname saira">${m.name}</span>${stateChip(m.state)}</div>
        <div class="kind">${m.kind}</div>
        <div class="prog">${DOCICON}<span>${m.program??'—'}</span></div>
      </div>
      <div class="metrics" data-r="metrics-${m.id}">${overviewMetrics(m,4)}</div>

  view.innerHTML = `

    </div>

  view.querySelectorAll('[data-lay]').forEach(b=>b.onclick=e=>{e.stopPropagation();layout=b.dataset.lay;renderOverview();});
  view.querySelectorAll('[data-open]').forEach(c=>c.onclick=()=>{route={view:'detail',id:c.dataset.open};renderDetail();});
  setActiveNav('overview');
}

/* ---------- detail ---------- */
function stateBreakdown(tl){
  const tot=tl.reduce((s,x)=>s+x.secs,0)||1, agg={};
  tl.forEach(x=>agg[x.state]=(agg[x.state]||0)+x.secs);
  return Object.entries(agg).sort((a,b)=>b[1]-a[1]).map(([s,secs])=>
    `<tr><td><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${STATE[s].c};margin-right:8px"></span>${STATE[s].label[0]+STATE[s].label.slice(1).toLowerCase()}</td>
      <td class="r">${dur(secs)}</td><td class="r" style="color:var(--muted)">${(secs/tot*100).toFixed(0)}%</td></tr>`).join('');
}
const dur=s=> s>=3600?(s/3600).toFixed(1)+' h':s>=60?(s/60).toFixed(0)+' min':Math.round(s)+' s';

function renderDetail(){
  const m=byId(route.id); const t=timelineBar(m.tl);
  let body;
  if(m.kind==='utility'){
    body=`<div class="panel"><h3>Process values</h3><div class="pv" data-r="pv">${m.process.map(p=>`<div class="b"><div class="v">${fmt(p.v)} <span style="font-size:.6em;color:var(--muted)">${p.u}</span></div><div class="l">${p.l}</div></div>`).join('')}</div></div>`;
  } else {
    body=`<div class="panel"><div class="gauges" data-r="gauges">
        <div class="g">${gaugeSVG(oee(m)*100,true)}<span class="lab">OEE</span></div>

      </div>
      <table class="kv" style="margin-top:18px"><tbody>
        <tr><td>Completed / total</td><td class="r"><b>${m.completed}</b> / ${m.total}</td></tr>
        ${m.q!=null?`<tr><td>Good / bad</td><td class="r">${m.good} / ${m.bad}</td></tr>`:''}
      </tbody></table></div>`;
  }
  view.innerHTML=`
    <div class="back" id="back"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg> Overview</div>
    <div class="head" style="margin-bottom:6px">
      <img class="mimg" src="${m.img}" alt="${m.name}" style="width:120px;height:76px;flex:0 0 120px">

      <span class="badge">Demo · simulated data</span>
      <span class="spacer"></span><button class="btn" id="opendash">Open dashboard</button><button class="chip-range">▦ 8H shift ▾</button>
    </div>
    <div class="prog" style="margin-bottom:4px">${m.program?DOCICON+'<span>Program: <b style="color:var(--ink)">'+m.program+'</b></span>':'<span class="kind" style="text-transform:capitalize">'+m.kind+'</span>'}</div>
    ${body}
    <div class="panel"><h3>Machine state · this shift</h3>
      <div class="tl"><div class="bar" data-r="tl-d">${t.bars}</div>
        <div class="key">${t.key}</div></div>
    </div>
    ${m.kind!=='utility'?`<div class="panel"><h3>Time by state</h3><table class="kv"><tbody data-r="brk">${stateBreakdown(m.tl)}</tbody></table></div>`:''}
    ${m.kind!=='utility' && m.programs.length ? `<div class="panel"><h3>Programs completed · this shift</h3>
      <div class="saira" style="font-weight:700;font-size:1.7rem;margin-bottom:12px">${m.programs.length}
        <span style="font-size:.5em;color:var(--muted);font-family:Roboto;font-weight:400">programs · ${m.programs.reduce((s,p)=>s+p.p,0)} parts</span></div>
      <table class="kv"><tbody>${m.programs.map(p=>`<tr><td>${p.n}</td><td class="r">${p.p} parts</td><td class="r" style="color:var(--muted)">${p.a} ago</td></tr>`).join('')}</tbody></table></div>` : ''}
    <div class="panel"><h3>Recent alarms</h3>${
      m.tl.some(x=>x.state==='DOWN')
      ? `<table class="kv"><tbody><tr><td>Drive fault · code 4021</td><td class="r" style="color:var(--muted)">2 h ago · 6 min</td></tr><tr><td>Guard interlock · code 301</td><td class="r" style="color:var(--muted)">5 h ago · 1 min</td></tr></tbody></table>`
      : `<div style="color:var(--muted);font-size:.9rem">No alarms in this shift.</div>`}
    </div>`;
  view.querySelector('#back').onclick=()=>{route={view:'overview'};renderOverview();};
  const od=document.getElementById('opendash'); if(od) od.onclick=()=>openDash(m.id);
  setActiveNav('overview');
}

function setActiveNav(key){ document.querySelectorAll('.side a[data-nav]').forEach(a=>a.classList.toggle('active',a.dataset.nav===key)); }

/* ---------- deterministic helpers ---------- */
function hstr(str){ let h=2166136261; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function rng(seed){ let a=seed>>>0; return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const h01=str=>hstr(str)/4294967296;
const localHour=()=>new Date().getHours()+new Date().getMinutes()/60;

/* ---------- per-machine data behind the dashboard widgets ---------- */
function ensureData(m){
  if(m.dense) return;
  const r=rng(hstr(m.id)); const o=[]; const down=m.kind==='utility'?0.01:0.05;
  for(let i=0;i<95;i++){ const x=r(); const st=x<0.74?'EXECUTING':x<0.85?'SETUP':x<0.93?'STARVED':x<0.93+down?'DOWN':'EXECUTING';
    o.push({state:st,secs:st==='EXECUTING'?50+r()*130:8+r()*34}); }
  o[o.length-1]={state:m.state,secs:60};
  m.dense=o;
  if(m.kind==='utility'){
    const walk=(base,step,n)=>{ const a=[]; let v=base; for(let i=0;i<n;i++){ v+=(r()-.5)*step; a.push(v);} return a; };
    m.trend={pur:walk(99.6,.12,120),pre:walk(298,5,120)};
    const pv=procVal(m,'purity'), qv=procVal(m,'pressure');
    const dp=pv.v-m.trend.pur[119], dq=qv.v-m.trend.pre[119];
    m.trend.pur=m.trend.pur.map(v=>v+dp); m.trend.pre=m.trend.pre.map(v=>v+dq);
  }
  const hr=[]; for(let h=0;h<24;h++){ const rr=rng(hstr(m.id+'h'+h)); const open=h>=7;
    const act=open?Math.round(42+rr()*52):0, alr=open&&rr()<.3?Math.round(rr()*6):0;
    hr.push({act,idle:open?100-act-alr:100,alr}); }
  m.heat=hr;
}

  puma:[['Cutting head: lens contamination warning',4],['Assist gas pressure low',2],['Nozzle touch sensor fault',1]],
  strippit:[['Punch station tool not ready',3],['Sheet clamp position fault',2]],
  hcn:[['Spindle load limit reached',3],['Coolant level low',2],['Door interlock open during cycle',1]],
};
const DASHES=[
  {id:'ppeb',m:'ppeb',tpl:'pressbrake',name:'PPEB 220/30 — Pressbrake — standard'},

  {id:'strippit',m:'strippit',tpl:'glance',name:'Strippit PX-1530 — OEE at a glance'},

  {id:'nitro',m:'nitro',tpl:'utility',name:'NitroCube N2 plant — Utility — process & uptime'},
];
const dashById=id=>DASHES.find(d=>d.id===id);
// the app's own default layouts (Core/DashboardTemplates.cs): x, y, w, h on a 12-column grid
const G=(t,x,y,w,h,title,metric)=>({t,x,y,w,h,title,metric});
const LAYOUTS={
  pressbrake:[G('gauge',0,0,3,3,'OEE','oee'),G('gauge',3,0,3,3,'Availability','availability'),G('gauge',6,0,3,3,'Performance','performance'),G('gauge',9,0,3,3,'Quality','quality'),
    G('text',0,3,4,2,'Active part'),G('prod',4,3,8,2,'Production'),G('state',0,5,12,2,'State'),G('faults',0,7,5,3,'Faults'),G('heat',5,7,7,3,'Status by hour')],
  laser:[G('gauge',0,0,3,3,'OEE','oee'),G('gauge',3,0,3,3,'Availability','availability'),G('gauge',6,0,3,3,'Performance','performance'),G('device',9,0,3,3,'Device status'),
    G('text',0,3,4,2,'Nesting'),G('prod',4,3,8,2,'Production'),G('state',0,5,12,2,'State'),G('faults',0,7,5,3,'Faults'),G('heat',5,7,7,3,'Status by hour')],
  glance:[G('gauge',0,0,3,3,'OEE','oee'),G('gauge',3,0,3,3,'Availability','availability'),G('gauge',6,0,3,3,'Performance','performance'),G('gauge',9,0,3,3,'Quality','quality'),G('state',0,3,12,2,'State')],
  utility:[G('kpi',0,0,3,3,'Uptime','uptime'),G('kpi',3,0,3,3,'O2 purity','purity'),G('kpi',6,0,3,3,'Pressure','pressure'),G('device',9,0,3,3,'Device status'),
    G('trend',0,3,12,3,'Process trend'),G('state',0,6,12,2,'State')],
};
const rowsOf=l=>Math.max(...l.map(w=>w.y+w.h));

function wGauge(pct){ const s=132,r=55,c=2*Math.PI*r,col=pct==null?'var(--gauge-track)':gaugeColor(pct),off=pct==null?c:c*(1-pct/100);
  return `<svg viewBox="0 0 ${s} ${s}" style="width:auto;height:100%;max-height:180px;max-width:100%"><circle cx="66" cy="66" r="${r}" fill="none" stroke="var(--gauge-track)" stroke-width="10"/><circle class="arc" cx="66" cy="66" r="${r}" fill="none" stroke="${col}" stroke-width="10" stroke-linecap="round" transform="rotate(-90 66 66)" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/><text x="66" y="78" text-anchor="middle" font-size="36" font-family="Saira" font-weight="700" fill="${pct==null?'var(--muted)':'var(--ink)'}">${pct==null?'—':Math.round(pct)}</text></svg>`; }
const hcol={ act:v=>v?`hsl(130 46% ${12+v*0.34}%)`:'var(--surface-2)', idle:v=>v?`hsl(28 58% ${14+v*0.22}%)`:'var(--surface-2)', alr:v=>v?`hsl(0 55% ${16+v*4}%)`:'var(--surface-2)' };
const fmtT=d=>d.toTimeString().slice(0,5);
function procVal(m,key){ const p=m.process.find(p=>p.l.toLowerCase().includes(key)); return p; }

function trendSVG(m){
  const W=600,H=100, line=(a,lo,hi,col)=>`<polyline fill="none" stroke="${col}" stroke-width="2" vector-effect="non-scaling-stroke" points="${a.map((v,i)=>`${(i/(a.length-1)*W).toFixed(1)},${(H-(v-lo)/(hi-lo)*H).toFixed(1)}`).join(' ')}"/>`;
  const grid=[0,25,50,75,100].map(y=>`<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="var(--line)" vector-effect="non-scaling-stroke"/>`).join('');
  const t=m.trend, plo=98.8, phi=100.2, rlo=270, rhi=325;
  return `<div class="ax"><span>${phi.toFixed(1)}</span><span>${((plo+phi)/2).toFixed(1)}</span><span>${plo.toFixed(1)}</span></div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${grid}${line(t.pur,plo,phi,'var(--accent)')}${line(t.pre,rlo,rhi,'var(--warn)')}</svg>
    <div class="ax"><span>${rhi}</span><span>${Math.round((rlo+rhi)/2)}</span><span>${rlo}</span></div>`;
}

function widgetInner(w,m){
  ensureData(m);
  switch(w.t){
    case 'gauge': { const pct=w.metric==='oee'?oee(m)*100:w.metric==='availability'?m.a*100:w.metric==='performance'?m.p*100:(m.q==null?null:m.q*100);
      return `<div class="gcell">${wGauge(pct)}</div><div class="gl" style="text-align:center;margin-top:2px">${w.title}</div>`; }
    case 'text': return `<div class="bigval"><div class="v" style="font-size:1.9rem;color:var(--ink-2)">${m.program}</div><div class="gl" style="margin-top:8px">${w.title}</div></div>`;
    case 'prod': { const k=m.kind==='laser'?[['Sheets',m.completed],['Programs',m.programs.length]]:
        [['Parts',m.completed],['Good',m.good],['Bad',m.bad],['Bends',m.completed*27],['Programs',m.programs.length]];
      return `<div class="kpis">${k.map(([l,v])=>`<div class="kpi"><div class="v">${v}</div><div class="gl">${l}</div></div>`).join('')}</div>`; }
    case 'state': { const tot=m.dense.reduce((s,x)=>s+x.secs,0)||1;
      const bars=m.dense.map(x=>`<i style="width:${(x.secs/tot*100).toFixed(2)}%;background:${STATE[x.state].c}"></i>`).join('');
      const key=['EXECUTING','SETUP','DOWN','STARVED'].map(s=>`<span style="display:inline-flex;align-items:center;gap:5px"><span style="width:9px;height:9px;border-radius:2px;background:${STATE[s].c};display:inline-block"></span>${s[0]+s.slice(1).toLowerCase()}</span>`).join('');
      return `<div style="flex:1;display:flex;flex-direction:column;min-height:0;width:100%"><div class="wbar">${bars}</div>
        <div style="display:flex;justify-content:space-between;font-size:.62rem;color:var(--muted);margin-top:4px"><span>${fmtT(new Date(Date.now()-3600000))}</span><span>${fmtT(new Date())}</span></div>
        <div style="display:flex;gap:14px;margin-top:6px;font-size:.66rem;color:var(--muted)">${key}</div></div>`; }
    case 'faults': { const f=FAULTS[m.id]||[]; const mx=Math.max(1,...f.map(x=>x[1]));
      return `<div class="pareto">${f.map(([n,c])=>`<div class="pr"><div><div class="pl">${n}</div><div class="pb"><i style="width:${c/mx*100}%"></i></div></div><div class="pn">${c}</div></div>`).join('')}</div>`; }
    case 'heat': { const hr=localHour();
      const row=(label,key,f)=>`<div class="rl">${label}</div>`+m.heat.map((c,h)=>{ const v=h<=Math.floor(hr)?c[key]:0; return `<div class="cell" style="background:${f(v)}">${v||''}</div>`; }).join('');
      return `<div class="heat"><div></div>${[...Array(24).keys()].map(h=>`<div class="hd">${h}</div>`).join('')}${row('Active','act',hcol.act)}${row('Idle','idle',hcol.idle)}${row('Alert','alr',hcol.alr)}</div>`; }
    case 'device': return `<div class="dev">
        <div class="r"><span>Connection</span><span><span class="dot" style="margin-right:6px"></span>Connected</span></div>
        <div class="r"><span>State</span>${stateChip(m.state)}</div>
        <div class="r"><span>${m.kind==='utility'?'Plant':'Program'}</span><span>${m.program||'Nitrogen generation'}</span></div>
        <div class="r"><span>Firmware</span><span>${m.kind==='utility'?'Unitronics 3.4':'Touch 8.9.2'}</span></div>
        <div class="r"><span>Last data</span><span>just now</span></div></div>`;
    case 'kpi': { let v,u='';
      if(w.metric==='uptime'){ v=(m.uptime*100).toFixed(1); u='%'; }
      else if(w.metric==='purity'){ const p=procVal(m,'purity'); v=p.v.toFixed(2); u='%'; }
      else { const p=procVal(m,'pressure'); v=Math.round(p.v); u='bar'; }
      return `<div class="bigval"><div class="v">${v}<small>${u}</small></div><div class="gl" style="margin-top:8px">${w.title}</div></div>`; }
    case 'trend': return `<div style="flex:1;display:flex;flex-direction:column;min-height:0;width:100%"><div class="trendw" data-r="trend">${trendSVG(m)}</div>
        <div style="display:flex;gap:16px;margin-top:6px;font-size:.66rem;color:var(--muted)"><span><i style="display:inline-block;width:9px;height:3px;background:var(--accent);margin-right:5px;vertical-align:middle"></i>O2 purity (%)</span><span><i style="display:inline-block;width:9px;height:3px;background:var(--warn);margin-right:5px;vertical-align:middle"></i>Pressure (bar, right axis)</span></div></div>`;
  }
  return '';
}
const LIVE_TYPES=new Set(['gauge','prod','state','device','kpi','trend','text']);
function board(d){
  const m=byId(d.m), L=LAYOUTS[d.tpl];
  return `<div class="wboard" style="--rows:${rowsOf(L)}">`+L.map((w,i)=>
    `<div class="wc" data-w="${i}" style="--x:${w.x+1};--w:${w.w};--y:${w.y+1};--h:${w.h}"><div class="wt">${w.title}</div><div class="wbody" style="${['gauge','device','kpi','text'].includes(w.t)?'flex-direction:column':''}">${widgetInner(w,m)}</div></div>`).join('')+`</div>`;
}

/* ---------- views: dashboards hub, a dashboard, kiosk + rotation ---------- */
let kiosk=false, curDash='ppeb', rot=null;
const ROT_SECS=15;
function openDash(id){ curDash=id; route={view:'dash',id}; renderDash(); }
function renderDashboards(){
  const cards=DASHES.map(d=>{ const m=byId(d.m); const n=LAYOUTS[d.tpl].length;
    return `<div class="dcard"><div class="th"><img src="${m.img}" alt=""></div><div class="db"><div class="dn">${d.name}</div>
      <div class="dm">${n} widgets · scoped to ${m.name}</div>
      <div class="da"><button class="btn pri" data-open="${d.id}">Open</button><button class="btn" data-kiosk="${d.id}">Kiosk</button></div></div></div>`; }).join('');
  view.innerHTML=`<div class="head"><h1 class="saira">Dashboards</h1><span class="cap">One board per machine, built from templates and editable in the app</span>
      <span class="badge">Demo · simulated data</span><span class="spacer"></span><button class="btn" disabled title="Create from a template, import, or build your own in the full app">＋ New dashboard</button></div>
    <div class="dgrid">${cards}</div>
    <div class="sech">Rotating kiosks</div>
    <div class="rotcard"><div class="rn">Shop floor loop</div>
      <div class="rd">${DASHES.length} dashboards · ${ROT_SECS} s each. Cycles on one wall display, with a title bar showing which dashboard is up.</div>
      <button class="kioskbtn" id="rotgo">▣ Start rotating kiosk</button></div>`;
  view.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openDash(b.dataset.open));
  view.querySelectorAll('[data-kiosk]').forEach(b=>b.onclick=()=>enterKiosk(b.dataset.kiosk,false));
  document.getElementById('rotgo').onclick=()=>enterKiosk(DASHES[0].id,true);
  setActiveNav('dashboards');
}
function renderDash(){
  const d=dashById(curDash), m=byId(d.m);
  const head=kiosk?'':`<div class="back" id="dback"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg> Dashboards</div>
    <div class="head"><h1 class="saira" style="font-size:1.7rem">${d.name}</h1><span class="badge">Demo · simulated data</span><span class="spacer"></span>
      <button class="kioskbtn" id="kenter">▣ Kiosk mode</button></div>`;
  const bar=kiosk&&rot?`<div class="rotbar"><b>${d.name}</b><span class="spacer"></span><span class="rc">${DASHES.indexOf(d)+1} / ${DASHES.length}</span><i class="dr" style="animation-duration:${ROT_SECS}s"></i></div>`:'';
  view.innerHTML=head+bar+board(d);
  const ke=document.getElementById('kenter'); if(ke) ke.onclick=()=>enterKiosk(curDash,false);
  const bk=document.getElementById('dback'); if(bk) bk.onclick=()=>{route={view:'dashboards'};renderDashboards();};
  setActiveNav('dashboards');
}
function enterKiosk(id,rotating){
  curDash=id; kiosk=true; route={view:'dash',id};
  document.body.classList.add('kiosk'); document.body.classList.toggle('norot',!rotating);
  clearInterval(rotTimer); rot=rotating?{}:null; renderDash();
  if(rotating) rotTimer=setInterval(()=>{ const i=(DASHES.findIndex(d=>d.id===curDash)+1)%DASHES.length; curDash=DASHES[i].id; route={view:'dash',id:curDash}; renderDash(); },ROT_SECS*1000);
  if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{});
}
let rotTimer=null;
function exitKiosk(){ kiosk=false; rot=null; clearInterval(rotTimer); document.body.classList.remove('kiosk','norot');
  if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(()=>{});
  route={view:'dashboards'}; renderDashboards(); }
document.getElementById('kexit').onclick=exitKiosk;
let kxTimer=null;
document.addEventListener('mousemove',()=>{ if(!kiosk) return; const b=document.getElementById('kexit'); b.classList.add('show'); clearTimeout(kxTimer); kxTimer=setTimeout(()=>b.classList.remove('show'),3000); });
document.addEventListener('fullscreenchange',()=>{ if(!document.fullscreenElement && kiosk) exitKiosk(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && kiosk) exitKiosk(); });

/* ---------- fleet: this site plus three simulated plants, each in its own time zone ---------- */
const SITES=[
 {id:'demo',name:'Demonstration plant',zone:'Pacific/Auckland',pat:'always',sh:[.60,.07,.04,.04,.25,0],P:.88,Q:.98,
  mach:null},
 {id:'wlg',name:'Wellington',zone:'Pacific/Auckland',pat:'two',sh:[.52,.06,.04,.03,.35,0],P:.91,Q:.97,mach:[
   ['Dyna-Press 40/12','pressbrake','img/dynapress.png'],['PPEB 135/30','pressbrake','img/ppeb.png'],['Phoenix 4kW','laser','img/phoenix.png'],['NitroCube N2 plant','utility','img/nitrocube.png']]},
 {id:'bne',name:'Brisbane',zone:'Australia/Brisbane',pat:'cont',sh:[.66,.08,.05,.09,.12,0],P:.84,Q:.96,bad7:true,mach:[
   ['Taurus 10kW','laser','img/taurus.png'],['Lynx 3kW','laser','img/lynx.png'],['EasyForm 220/30','pressbrake','img/easyform.png'],['ToolCell 135/30','pressbrake','img/toolcell.png'],['Strippit PX-1530','punching','img/strippit.png']]},
 {id:'per',name:'Perth',zone:'Australia/Perth',pat:'six',sh:[.56,.07,.05,.05,.27,0],P:.79,Q:.97,flaky:true,mach:[
   ['Puma 6kW','laser','img/puma.png'],['PPED 170/30','pressbrake','img/pped.png'],['HCN-5000 machining centre','machining','img/hcn.png']]},
];
SITES[0].mach=MACHINES.map(m=>[m.name,m.kind,m.img,m.id]);
const KIND_LABEL={pressbrake:'Pressbrake',laser:'Laser',punching:'Punching',machining:'Machining',utility:'Utility'};
function localParts(zone){ const f=new Intl.DateTimeFormat('en-GB',{timeZone:zone,weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());
  const g=t=>f.find(p=>p.type===t).value; return {dow:g('weekday'),h:+g('hour')%24,min:+g('minute')}; }
function onShift(pat,dow,h){ const wk=['Mon','Tue','Wed','Thu','Fri'].includes(dow);
  if(pat==='always') return true;
  if(pat==='two') return (wk&&h>=6&&h<22)||(dow==='Sat'&&h>=6&&h<12);
  if(pat==='cont') return wk||((dow==='Sat'||dow==='Sun')&&h>=6&&h<14);
  return (wk||dow==='Sat')&&h>=6&&h<22; }
function fleetState(site,mm,idx){
  const lp=localParts(site.zone);
  if(site.id==='demo') return byId(mm[3]).state;
  if(!onShift(site.pat,lp.dow,lp.h)) return 'OFF';
  const x=h01(site.id+idx+Math.floor(Date.now()/150000));
  const down=site.bad7?.10:.06;
  return x<.76?'EXECUTING':x<.84?'SETUP':x<.90?'STARVED':x<.90+down?'DOWN':'EXECUTING'; }
const PERIODS={today:['Today',null],yday:['Yesterday',24],w7:['Last 7 days',168]};
let fleetTab='site', fleetPeriod='yday', fleetLayout='rows';
function siteStats(site,period,key){
  const j=s=>(h01(site.id+period+key+s)-.5)*.04;
  let sh=site.sh.slice(); sh=sh.map((v,i)=>Math.max(0,v+(i<5?j(i):0)));
  if(site.bad7&&period==='w7'){ sh[0]-=.06; sh[3]+=.05; sh[1]+=.01; }
  const tot=sh.reduce((a,b)=>a+b,0); sh=sh.map(v=>v/tot);
  const lp=localParts(site.zone), todayH=Math.max(1,lp.h+lp.min/60);
  const hours=period==='today'?todayH:PERIODS[period][1];
  const A=sh[0], P=clamp(site.P+j(9),.5,.99), Q=clamp(site.Q+j(8),.85,1);
  return {sh,A,P,Q,O:A*P*Q,hours};
}
function siteView(site){
  const st=siteStats(site,fleetPeriod,'s'), n=site.mach.length, lp=localParts(site.zone);
  const mh=n*st.hours;
  const names=['Producing','Setup','Waiting','Down','Switched off','No data'];
  const cols=['var(--st-exec)','var(--st-setup)','var(--st-starved)','var(--st-down)','var(--st-off)','#b8c0cc'];
  const bar=st.sh.map((v,i)=>`<i style="width:${(v*100).toFixed(2)}%;background:${cols[i]}" title="${names[i]} ${(v*mh).toFixed(0)} h"></i>`).join('');
  const key=st.sh.map((v,i)=>v>0.0005?`<span><i style="background:${cols[i]}"></i>${names[i]} ${(v*mh).toFixed(0)} h</span>`:'').join('');
  const prod=site.mach.filter(x=>x[1]!=='utility'), hasQ=site.mach.some(x=>x[1]==='pressbrake');
  const rows=site.mach.map((x,i)=>{ const u=x[1]==='utility'; const s2=siteStats(site,fleetPeriod,x[0]);
    const q=(x[1]==='pressbrake'||x[1]==='machining')?s2.Q:null;
    return `<tr><td>${x[0]}</td><td>${KIND_LABEL[x[1]]}</td><td>${u?'Uptime '+Math.round(clamp(s2.A+.3,.9,.995)*100)+'%':Math.round(s2.O*(q==null?1:1)*100)+'%'}</td><td>${u?'—':Math.round(s2.A*100)+'%'}</td><td>${u?'—':Math.round(s2.P*100)+'%'}</td><td>${q==null?'—':Math.round(q*100)+'%'}</td></tr>`; }).join('');
  const lag=site.flaky&&Math.floor(Date.now()/60000)%5===0;
  const running=site.mach.filter((x,i)=>fleetState(site,x,i)==='EXECUTING').length;
  return `<div class="site"><div class="sh"><div><div class="sn">${site.name}</div><div class="ss">${n} machines · ${site.id==='demo'?'this site':'local time'} <span data-clock="${site.zone}">${String(lp.h).padStart(2,'0')}:${String(lp.min).padStart(2,'0')}</span> · ${running} running</div></div>
      <span class="spacer"></span>${lag?'<span class="warnchip">last contact 2 min ago</span>':''}</div>
    <div class="sm">${metricTile('OEE',st.O,true)}${metricTile('Availability',st.A)}${metricTile('Performance',st.P)}${metricTile('Quality',hasQ?st.Q:null)}</div>
    <div class="shb"><div class="hrs">${bar}</div><div class="hkey">${key}</div></div>
    <details style="border-top:1px solid var(--line)"><summary style="cursor:pointer;padding:10px 18px;color:var(--accent);font-size:.84rem;font-weight:600">Machines</summary>
      <table class="mtab"><thead><tr><th>Machine</th><th>Type</th><th>OEE</th><th>Avail.</th><th>Perf.</th><th>Qual.</th></tr></thead><tbody>${rows}</tbody></table></details></div>`;
}
function liveRows(site){
  const lp=localParts(site.zone);
  const rows=site.mach.map((x,i)=>{ const stt=fleetState(site,x,i), u=x[1]==='utility', off=stt==='OFF';
    const s2=siteStats(site,'yday',x[0]); const q=(x[1]==='pressbrake'||x[1]==='machining')?s2.Q:null;
    const mt=u?`<div class="mt primary"><div class="v">${Math.round(clamp(s2.A+.3,.9,.995)*100)}<span style="font-size:.55em;color:var(--muted)">%</span></div><div class="l">Uptime</div></div>`
      : metricTile('OEE',off?null:s2.O,true)+metricTile('Avail',off?null:s2.A)+metricTile('Perf',off?null:s2.P)+metricTile('Qual',off?null:q);
    return `<div class="lrow"><img src="${x[2]}" alt=""><div class="ln">${x[0]}</div>${stateChip(stt)}<div class="lp">${KIND_LABEL[x[1]]}</div><span class="spacer"></span><div class="lm">${mt}</div></div>`; }).join('');
  return `<div class="site"><div class="sh" style="padding:12px 16px"><div class="sn" style="font-size:1.02rem">${site.name}</div><div class="ss">local time <span data-clock="${site.zone}">${String(lp.h).padStart(2,'0')}:${String(lp.min).padStart(2,'0')}</span></div></div>${rows}</div>`;
}
function renderFleet(){
  const body=fleetTab==='live'?SITES.map(liveRows).join('')
    :SITES.map(siteView).join('')+`<p class="note"><b>Monitored</b> time is every hour FACTS could see a machine. Availability = producing ÷ monitored time, so switched-off time counts against it. Each site uses its own local calendar day; utilities show Uptime and are left out of site OEE.</p>`;
  view.innerHTML=`<div class="head"><h1 class="saira">Fleet</h1><span class="cap">${SITES.length} sites · ${SITES.reduce((a,s)=>a+s.mach.length,0)} machines</span><span class="badge">Demo · simulated data</span><span class="spacer"></span>
      ${fleetTab==='site'?`<select class="sel" id="fper">${Object.entries(PERIODS).map(([k,v])=>`<option value="${k}" ${k===fleetPeriod?'selected':''}>${v[0]}</option>`).join('')}</select>`:''}
      <span class="tabs"><button data-ft="live" class="${fleetTab==='live'?'on':''}">Live</button><button data-ft="site" class="${fleetTab==='site'?'on':''}">By site</button></span></div>${body}`;
  view.querySelectorAll('[data-ft]').forEach(b=>b.onclick=()=>{fleetTab=b.dataset.ft;renderFleet();});
  const fp=document.getElementById('fper'); if(fp) fp.onchange=()=>{fleetPeriod=fp.value;renderFleet();};
  setActiveNav('fleet');
}
function tickClocks(){ document.querySelectorAll('[data-clock]').forEach(el=>{ const lp=localParts(el.dataset.clock); el.textContent=String(lp.h).padStart(2,'0')+':'+String(lp.min).padStart(2,'0'); }); }

/* ---------- automations: the two example rules the real demo seeds + their history ---------- */
const RULES=[
 {id:'n2',name:'Nitrogen plant down for 5 minutes',on:true,when:['NitroCube N2 plant status is Down or Off for 5 min'],only:[],
  then:'Email maintenance@example.com',then2:'At most every 30 min · send a follow-up when things are back to normal',cool:30,res:true},
 {id:'pb',name:'Press brake alarm during office hours',on:true,when:['PPEB 220/30 · any alarm active for 30 s'],only:['Mon, Tue, Wed, Thu, Fri 07:00-17:00'],
  then:'Email production@example.com',then2:'At most every 15 min',cool:15,res:false},
];
function ago(min){ const d=new Date(Date.now()-min*60000); return d.toLocaleString('en-GB',{weekday:'short',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }
function renderAutomations(){
  const cards=RULES.map(r=>`<div class="auto"><div class="ah"><b>${r.name}</b><button class="sw2 ${r.on?'on':''}" data-sw="${r.id}" title="Switch on or off" aria-label="Switch ${r.name} on or off"></button></div>
    <div class="ar"><span class="ak">When</span><span class="av">${r.when.map(w=>`<span>${w}</span>`).join('')}<span class="sub">One email when this starts, not repeated while it lasts</span></span></div>
    ${r.only.length?`<div class="ar"><span class="ak">Only if</span><span class="av">${r.only.map(w=>`<span>${w}</span>`).join('')}</span></div>`:''}
    <div class="ar"><span class="ak">Then</span><span class="av"><span>${r.then}</span><span class="sub">${r.then2}</span></span></div>
    <div class="af"><span>Cooldown ${r.cool} min</span><span>${r.res?'Follow-up email when resolved':'No follow-up email'}</span><span>Email is off in this demo — nothing is sent</span></div></div>`).join('');
  const at=(daysBack,h,m)=>{ const d=new Date(); d.setDate(d.getDate()-daysBack); d.setHours(h,m,0,0); return d; };
  const lastWk=(()=>{ let n=1; for(;n<8;n++){ const d=at(n,12,0); if(d.getDay()>=1&&d.getDay()<=5) break; } return n; })();
  const E=[[at(1,14,22),'n2','fired','NitroCube N2 plant status is Down for 5 min'],[at(1,14,41),'n2','resolved','Resolved after 19 min'],
           [at(lastWk,9,12),'pb','fired','PPEB 220/30 · PCSS_ERR 402A active for 30 s'],[at(lastWk,9,21),'pb','skip','Skipped: cooldown (15 min) after the previous email'],
           [at(lastWk,17,42),'pb','skip','Suppressed: outside Mon, Tue, Wed, Thu, Fri 07:00-17:00'],
           [at(4,3,10),'n2','fired','NitroCube N2 plant status is Off for 5 min'],[at(4,3,41),'n2','resolved','Resolved after 31 min']].sort((x,y)=>y[0]-x[0]);
  const H=E.map(([d,id,o,t])=>[d,id,o,t]);
  const lab={fired:'Fired',resolved:'Resolved',skip:'Skipped'};
  const hist=H.map(([dt,id,o,d])=>`<tr><td class="t">${dt.toLocaleString('en-GB',{weekday:'short',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</td><td>${RULES.find(r=>r.id===id).name}</td><td><span class="out ${o}">${lab[o]}</span></td><td>${d}${o==='fired'||o==='resolved'?' <span style="color:var(--muted)">(recorded, not sent: email off)</span>':''}</td></tr>`).join('');
  view.innerHTML=`<div class="head"><h1 class="saira">Automations</h1><span class="cap">Triggers, conditions and an email</span><span class="badge">Demo · simulated data</span><span class="spacer"></span>
      <button class="btn" disabled title="Create and edit rules in the full app">＋ New automation</button></div>${cards}
    <div class="sech">History</div><div class="auto" style="margin:0"><table class="hist"><tbody>${hist}</tbody></table></div>`;
  view.querySelectorAll('[data-sw]').forEach(b=>b.onclick=()=>{ const r=RULES.find(x=>x.id===b.dataset.sw); r.on=!r.on; b.classList.toggle('on',r.on); });
  setActiveNav('automations');
}

/* ---------- live simulation ---------- */
const NEXT={EXECUTING:['SETUP','STARVED','DOWN'],SETUP:['EXECUTING'],STARVED:['EXECUTING'],DOWN:['EXECUTING'],OFF:['EXECUTING']};
function tickModel(){
  MACHINES.forEach(m=>{
    // drift A/P/Q
    if(m.kind!=='utility'){
      m.a=clamp(m.a+rnd(-.01,.012),.55,.99);
      m.p=clamp(m.p+rnd(-.012,.012),.5,.99);
      if(m.q!=null) m.q=clamp(m.q+rnd(-.004,.004),.9,1);
      if(m.state==='EXECUTING' && Math.random()<.6){ m.completed=Math.min(m.total,m.completed+1); if(m.q!=null&&Math.random()<.96)m.good++; else if(m.q!=null)m.bad++; }
    } else {
      m.process.forEach(p=>{ const j=p.l.includes('purity')?.03:p.l.includes('temp')?.15:p.l.includes('flow')?.4:3; p.v=+(p.v+rnd(-j,j)).toFixed(p.l.includes('purity')?2:1); });
      m.uptime=clamp(m.uptime+rnd(-.001,.0012),.95,1);
    }
    // state machine: small chance to transition
    const last=m.tl[m.tl.length-1];
    last.secs+=6;
    if(Math.random()< (m.state==='EXECUTING'?.06:.16)){
      const opts=NEXT[m.state]; const ns=opts[Math.floor(Math.random()*opts.length)];
      m.state=ns; m.tl.push({state:ns,secs:6});
      if(m.tl.length>14) m.tl.shift();
      ensureData(m); m.dense.push({state:ns,secs:20}); if(m.dense.length>110) m.dense.shift();
    } else { ensureData(m); m.dense[m.dense.length-1].secs+=6; }
    if(m.trend){ const p=procVal(m,'purity'), q=procVal(m,'pressure');
      m.trend.pur.push(p.v); m.trend.pur.shift(); m.trend.pre.push(q.v); m.trend.pre.shift(); }
  });
}
function updateLive(){
  MACHINES.forEach(m=>{
    // overview metrics + timeline + state chip (rebuild those small bits in place)
    const met=view.querySelector(`[data-r="metrics-${m.id}"]`);
    if(met) met.innerHTML = overviewMetrics(m, layout==='grid'?2:4);
    const tl=view.querySelector(`[data-r="tl-${m.id}"]`);
    if(tl){ const t=timelineBar(m.tl); tl.innerHTML=t.bars; }
    // state chips carry no data-r; refresh via card scan
  });
  // refresh state chips + detail if open
  if(route.view==='overview'){
    view.querySelectorAll('[data-open]').forEach(card=>{
      const m=byId(card.dataset.open); const chip=card.querySelector('.state');
      if(chip){ chip.style.background=STATE[m.state].c; chip.textContent=STATE[m.state].label; }
    });
  } else if(route.view==='detail'){
    const m=byId(route.id);
    const g=view.querySelector('[data-r="gauges"]'); if(g&&m.kind!=='utility'){
      g.innerHTML=`<div class="g">${gaugeSVG(oee(m)*100,true)}<span class="lab">OEE</span></div>
        <div class="g">${gaugeSVG(m.a*100)}<span class="lab">Availability</span></div>
        <div class="g">${gaugeSVG(m.p*100)}<span class="lab">Performance</span></div>
        ${m.q==null?'<div class="g"><div style="width:58px;height:58px;display:flex;align-items:center;justify-content:center;font-family:Saira;font-size:1.4rem;color:var(--muted)">—</div><span class="lab">Quality</span></div>':`<div class="g">${gaugeSVG(m.q*100)}<span class="lab">Quality</span></div>`}`;
    }
    const tld=view.querySelector('[data-r="tl-d"]'); if(tld) tld.innerHTML=timelineBar(m.tl).bars;
    const brk=view.querySelector('[data-r="brk"]'); if(brk) brk.innerHTML=stateBreakdown(m.tl);
    const chip=view.querySelector('.head .state'); if(chip){chip.style.background=STATE[m.state].c;chip.textContent=STATE[m.state].label;}
    const pv=view.querySelector('[data-r="pv"]'); if(pv&&m.kind==='utility') pv.innerHTML=m.process.map(p=>`<div class="b"><div class="v">${fmt(p.v)} <span style="font-size:.6em;color:var(--muted)">${p.u}</span></div><div class="l">${p.l}</div></div>`).join('');
  } else if(route.view==='dash'){
    const d=dashById(curDash), m=byId(d.m), L=LAYOUTS[d.tpl];
    L.forEach((w,i)=>{ if(!LIVE_TYPES.has(w.t)) return; const el=view.querySelector(`.wc[data-w="${i}"] .wbody`); if(el) el.innerHTML=widgetInner(w,m); });
  }
  tickClocks();
}

// nav routing
document.querySelector('.side a[data-nav="overview"]').onclick=()=>{ route={view:'overview'}; renderOverview(); };
document.querySelector('.side a[data-nav="dashboards"]').onclick=()=>{ route={view:'dashboards'}; renderDashboards(); };
document.querySelector('.side a[data-nav="fleet"]').onclick=()=>{ route={view:'fleet'}; renderFleet(); };
document.querySelector('.side a[data-nav="automations"]').onclick=()=>{ route={view:'automations'}; renderAutomations(); };
// collapsible sidebar
const sideEl=document.querySelector('.side'), restoreEl=document.getElementById('restore');
document.querySelector('.side .hide').onclick=()=>{ sideEl.classList.add('collapsed'); restoreEl.classList.add('show'); };
restoreEl.onclick=()=>{ sideEl.classList.remove('collapsed'); restoreEl.classList.remove('show'); };

const openM=QS.get('m'), qd=QS.get('d')&&dashById(QS.get('d'))?QS.get('d'):'ppeb', qv=QS.get('view');
if(QS.get('layout')==='grid') layout='grid';
if(QS.get('tab')==='live') fleetTab='live';
if(PERIODS[QS.get('period')]) fleetPeriod=QS.get('period');
if(QS.get('kiosk')==='1'){ curDash=qd; kiosk=true; document.body.classList.add('kiosk'); const rotating=QS.get('rotation')==='1'; document.body.classList.toggle('norot',!rotating);
  rot=rotating?{}:null; route={view:'dash',id:curDash}; renderDash();
  if(rotating) rotTimer=setInterval(()=>{ const i=(DASHES.findIndex(x=>x.id===curDash)+1)%DASHES.length; curDash=DASHES[i].id; route={view:'dash',id:curDash}; renderDash(); },ROT_SECS*1000); }
else if(qv==='dashboards'){ route={view:'dashboards'}; renderDashboards(); }
else if(qv==='dashboard'||QS.get('d')){ openDash(qd); }
else if(qv==='fleet'){ route={view:'fleet'}; renderFleet(); }
else if(qv==='automations'){ route={view:'automations'}; renderAutomations(); }
else if(openM && byId(openM)){ route={view:'detail',id:openM}; renderDetail(); }
else { renderOverview(); }
if(!RM){ setInterval(()=>{ tickModel(); updateLive(); }, 2000); }
</script>
